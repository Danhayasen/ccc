# Publica o SkyCrew no GitHub Pages (https://danhayasen.github.io/ccc/):
#  - jogo/        versao de navegador (three.js + regras do jogo em C# compiladas para WebAssembly)
#  - aviao/       visualizador 3D do aviao
#  - jogo-unity/  build WebGL da Unity, somente se a licenca da Unity estiver nos segredos
# Passo a passo: SkyCrew/Docs/PUBLICAR_NO_NAVEGADOR.md
name: Publicar jogo no navegador

on:
  push:
    branches: [main, claude/beautiful-gates-dsnswj]
    paths: ['SkyCrew/**', 'aviao/**', '.github/workflows/publicar-jogo.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-jogo
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testes das regras do jogo
        run: dotnet test SkyCrew/Tools/Verificacao/Tests/SkyCrew.Tests.EditMode.csproj -nologo

      - name: Compilar as regras para WebAssembly
        run: dotnet publish SkyCrew/Web/Regras/SkyCrew.Web.Regras.csproj -c Release -o build/regras -nologo

      - name: Verificar licenca da Unity
        id: licenca
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem licenca da Unity: publicando a versao de navegador (three.js) e o visualizador."
          fi

      - name: Liberar espaco em disco
        if: steps.licenca.outputs.ok == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Cache da pasta Library
        if: steps.licenca.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: SkyCrew/Library
          key: Library-WebGL-${{ hashFiles('SkyCrew/Assets/**', 'SkyCrew/Packages/**', 'SkyCrew/ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Compilar com a Unity (WebGL)
        if: steps.licenca.outputs.ok == 'true'
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        with:
          projectPath: SkyCrew
          unityVersion: 6000.0.84f1
          targetPlatform: WebGL
          buildName: SkyCrew
          buildsPath: build
          buildMethod: SkyCrew.EditorTools.SkyCrewBuild.BuildWebGL
          versioning: None
          allowDirtyBuild: true

      - name: Montar o site
        run: |
          mkdir -p site/jogo/regras
          cp SkyCrew/Tools/Site/index.html site/index.html
          rsync -a --exclude 'blender' --exclude '*.blend' --exclude '*.blend1' aviao/ site/aviao/
          rsync -a --exclude 'regras' SkyCrew/Web/jogo/ site/jogo/
          cp -r build/regras/wwwroot/_framework site/jogo/regras/
          if [ -f build/WebGL/SkyCrew/index.html ]; then
            mkdir -p site/jogo-unity
            sudo cp -r build/WebGL/SkyCrew/. site/jogo-unity/
            sudo chown -R "$(id -u):$(id -g)" site/jogo-unity
          fi
          touch site/.nojekyll
          du -sh site site/*

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicar SkyCrew no navegador'
